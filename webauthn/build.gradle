import org.codehaus.groovy.runtime.GStringImpl

buildscript {
    project.ext.isSnapshot = project.snapshotBuild.toBoolean()

    // Use properties for version to avoid configuration cache issues
    if (project.ext.isSnapshot) {
        project.ext.versionName = "${project.versionMajor}.${project.versionMinor}.${project.versionPatch}-SNAPSHOT" as GStringImpl
    } else {
        project.ext.versionName = "${project.versionMajor}.${project.versionMinor}.${project.versionPatch}" as GStringImpl
    }
}


plugins {
    id "maven-publish"
    id "signing"
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
    alias(libs.plugins.kotlin.serialization)
    id "de.mannodermaus.android-junit5"
    alias(libs.plugins.ktlint)
}

android {
    namespace = "com.linecorp.webauthn"
    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 28
        targetSdk 35

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArgument("runnerBuilder", "de.mannodermaus.junit5.AndroidJUnit5Builder")
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
        freeCompilerArgs += [
            "-language-version", "2.0",
            "-api-version", "2.0"
        ]
    }
    testOptions {
        unitTests.all {
            it.useJUnitPlatform()
        }
        unitTests {
            includeAndroidResources = true
        }
    }
    buildFeatures {
        buildConfig = true
    }

    publishing {
        singleVariant("release") {}
    }

    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1,LICENSE.md,LICENSE-notice.md,NOTICE.md}"
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.kotlinx.coroutines.core

    // library for test
    androidTestImplementation libs.kotlin.test.junit
    androidTestImplementation libs.kotlinx.coroutines.test
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.mockk.android
    androidTestImplementation libs.androidx.fragment.testing
    testImplementation libs.mockk.android
    testImplementation libs.kotlin.test.junit
    testImplementation libs.kotlinx.coroutines.test

    // junit5
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.junit.jupiter.params

    androidTestImplementation platform(libs.junit.bom)
    androidTestImplementation libs.junit.jupiter.api
    androidTestRuntimeOnly libs.junit.jupiter.engine
    androidTestImplementation libs.junit.jupiter.params

    // truth
    androidTestImplementation libs.truth
    testImplementation libs.truth

    // cbor
    implementation libs.cbor

    // coroutine
    implementation libs.kotlinx.coroutines.android

    // androidx biometric
    implementation libs.androidx.biometric

    // serialization
    implementation libs.kotlinx.serialization.json

    implementation libs.kotlin.reflect
}

android.libraryVariants.configureEach { variant ->
    variant.outputs.all {
        outputFileName = "webauthn-kotlin-${variant.name}.aar"
    }
}

// Generate sources and javadoc JARs
tasks.register('androidSourcesJar', Jar) {
    archiveClassifier.set("sources")
    from android.sourceSets.main.java.srcDirs
}

tasks.register('androidJavadocJar', Jar) {
    archiveClassifier.set("javadoc")
    from "docs/javadoc" // You can generate this or use placeholder
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifact androidSourcesJar
                artifact androidJavadocJar

                groupId = "com.linecorp"
                artifactId = "webauthn-kotlin"
                version = project.ext.versionName

                pom {
                    name.set(artifactId)
                    description.set("A Kotlin library for implementing WebAuthn authentication in Android applications")
                    url.set("https://github.com/line/webauthn-kotlin")

                    licenses {
                        license {
                            name.set("The Apache License, Version 2.0")
                            url.set("https://www.apache.org/licenses/LICENSE-2.0.txt")
                        }
                    }

                    developers {
                        developer {
                            name.set("LY Corporation")
                            email.set("dl_oss_dev@linecorp.com")
                            url.set("https://engineering.linecorp.com/en/")
                        }
                    }

                    scm {
                        connection.set("scm:git@github.com:line/webauthn-kotlin.git")
                        developerConnection.set("scm:git:ssh://github.com:line/webauthn-kotlin.git")
                        url.set("https://github.com/line/webauthn-kotlin")
                    }
                }
            }
        }
    }

    signing {
        def signingKeyId = project.findProperty("signingKeyId")
        def signingKey = project.findProperty("signingKey")
        def signingPassword = project.findProperty("signingPassword")

        if (signingKeyId && signingKey && signingPassword) {
            useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
            sign publishing.publications.release
        }
    }
}
